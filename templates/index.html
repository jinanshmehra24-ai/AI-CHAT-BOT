<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nova — AI Chat</title>
<style>
  :root {
    --bg: #0b0b12;
    --panel: #121220;
    --panel-2: #171728;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0f5;
    --text-dim: #9494a8;
    --grad-a: #7c5cff;
    --grad-b: #22d3ee;
    --user-bubble: linear-gradient(135deg, #7c5cff, #5b8cff);
    --bot-bubble: #1c1c2e;
    --danger: #ff5c7c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }
  body {
    display: flex;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- Overlay (mobile) ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(2px);
    z-index: 15;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 272px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    z-index: 16;
    transition: transform 0.25s ease;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 16px 10px;
  }
  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
    box-shadow: 0 0 16px rgba(124,92,255,0.5);
  }
  .brand-name {
    font-size: 17px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 0.2px;
  }
  .new-chat-btn {
    margin: 8px 14px 4px;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s, border-color 0.15s;
  }
  .new-chat-btn:hover { background: #1e1e33; border-color: rgba(124,92,255,0.4); }
  .conv-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 10px;
  }
  .conv-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    padding: 8px 8px 6px;
  }
  .conv-item {
    padding: 10px 11px;
    border-radius: 10px;
    font-size: 13.5px;
    color: #d5d5e2;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    transition: background 0.15s;
  }
  .conv-item:hover { background: var(--panel-2); }
  .conv-item.active {
    background: linear-gradient(135deg, rgba(124,92,255,0.18), rgba(34,211,238,0.12));
    border: 1px solid rgba(124,92,255,0.3);
  }
  .conv-item .del-btn {
    opacity: 0;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
    padding: 3px 6px;
    border-radius: 6px;
    flex-shrink: 0;
    line-height: 1;
  }
  .conv-item:hover .del-btn { opacity: 1; }
  .conv-item .del-btn:hover { color: var(--danger); background: rgba(255,92,124,0.12); }
  .sidebar-footer {
    padding: 14px 16px;
    font-size: 11.5px;
    color: var(--text-dim);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .pulse-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #22e07a;
    box-shadow: 0 0 6px #22e07a;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* ---------- Main chat area ---------- */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    min-width: 0;
    position: relative;
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(124,92,255,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(34,211,238,0.08), transparent 55%),
      var(--bg);
  }
  .header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .icon-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    width: 34px;
    height: 34px;
    cursor: pointer;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover { background: #22223a; color: var(--text); }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
  }

  /* Welcome / empty state */
  .welcome {
    margin: auto;
    text-align: center;
    padding: 24px;
  }
  .welcome-mark {
    width: 56px;
    height: 56px;
    margin: 0 auto 16px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    box-shadow: 0 0 30px rgba(124,92,255,0.45);
  }
  .welcome h2 {
    font-size: 22px;
    margin: 0 0 6px;
    background: linear-gradient(135deg, #fff, #b9b9d9);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .welcome p { color: var(--text-dim); font-size: 14px; margin: 0 0 22px; }
  .chip-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    max-width: 520px;
    margin: 0 auto;
  }
  .chip {
    text-align: left;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s, background 0.15s;
  }
  .chip:hover {
    border-color: rgba(124,92,255,0.5);
    background: var(--panel-2);
    transform: translateY(-1px);
  }
  @media (max-width: 520px) {
    .chip-grid { grid-template-columns: 1fr; }
  }

  /* Message rows */
  .msg-row {
    display: flex;
    gap: 10px;
    max-width: 85%;
    animation: rise 0.28s ease;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.bot { align-self: flex-start; }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    margin-top: 2px;
  }
  .msg-row.bot .avatar {
    background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
    box-shadow: 0 0 12px rgba(124,92,255,0.35);
  }
  .msg-row.user .avatar {
    background: var(--panel-2);
    border: 1px solid var(--border);
  }

  .msg-col { display: flex; flex-direction: column; min-width: 0; }
  .msg-row.user .msg-col { align-items: flex-end; }

  .msg {
    padding: 11px 15px;
    border-radius: 16px;
    line-height: 1.55;
    font-size: 14.5px;
    word-wrap: break-word;
  }
  .msg-row.user .msg {
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg-row.bot .msg {
    background: var(--bot-bubble);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg code {
    background: rgba(255,255,255,0.08);
    padding: 1px 5px;
    border-radius: 5px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 13px;
  }
  .msg pre.code-block {
    background: #0a0a14;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    overflow-x: auto;
    margin: 6px 0;
  }
  .msg pre.code-block code {
    background: none;
    padding: 0;
    font-size: 12.5px;
  }

  .typing-dots {
    display: flex;
    gap: 4px;
    padding: 4px 2px;
  }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  .copy-btn {
    margin-top: 5px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 11.5px;
    cursor: pointer;
    padding: 3px 8px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.15s, background 0.15s, color 0.15s;
  }
  .msg-row.bot:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { background: var(--panel-2); color: var(--text); }
  .copy-btn.copied { opacity: 1; color: #22e07a; }

  /* Input */
  .input-area {
    padding: 14px 20px 18px;
    flex-shrink: 0;
  }
  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 8px 8px 16px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input-row:focus-within {
    border-color: rgba(124,92,255,0.5);
    box-shadow: 0 0 0 3px rgba(124,92,255,0.12);
  }
  .input-row textarea {
    flex: 1;
    border: none;
    outline: none;
    background: none;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    max-height: 140px;
    line-height: 1.4;
    padding: 6px 0;
  }
  .input-row textarea::placeholder { color: var(--text-dim); }
  .send-btn {
    background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
    color: white;
    border: none;
    border-radius: 14px;
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s, transform 0.1s;
  }
  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled { opacity: 0.4; cursor: default; }
  .hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
  }

  @media (max-width: 760px) {
    .sidebar {
      position: fixed;
      left: 0; top: 0;
      transform: translateX(-100%);
    }
    .sidebar.open { transform: translateX(0); box-shadow: 0 0 40px rgba(0,0,0,0.5); }
    .messages { padding: 18px 14px 8px; }
    .input-area { padding: 10px 12px 14px; }
    .msg-row { max-width: 92%; }
  }
</style>
</head>
<body>
  <div class="overlay" id="overlay"></div>

  <div class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">✨</div>
      <div class="brand-name">Nova</div>
    </div>
    <button class="new-chat-btn" id="newChatBtn">
      <span>+</span> New chat
    </button>
    <div class="conv-list">
      <div class="conv-label">Recent</div>
      <div id="convItems"></div>
    </div>
    <div class="sidebar-footer">
      <span class="pulse-dot"></span> Powered by Gemini
    </div>
  </div>

  <div class="main">
    <div class="header">
      <button class="icon-btn" id="toggleBtn" title="Toggle sidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 id="chatTitle">New chat</h1>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <div class="input-row">
        <textarea id="input" placeholder="Message Nova..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn" title="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/></svg>
        </button>
      </div>
      <div class="hint">Enter to send · Shift+Enter for a new line</div>
    </div>
  </div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const newChatBtn = document.getElementById('newChatBtn');
const convItemsEl = document.getElementById('convItems');
const toggleBtn = document.getElementById('toggleBtn');
const sidebarEl = document.getElementById('sidebar');
const overlayEl = document.getElementById('overlay');
const chatTitleEl = document.getElementById('chatTitle');

let activeConvId = null;
const isMobile = () => window.matchMedia('(max-width: 760px)').matches;

const SUGGESTIONS = [
  "Explain AI in simple words",
  "Give me 3 project ideas to learn coding",
  "Write a short motivational quote",
  "What's a fun fact about space?"
];

function openSidebar() {
  sidebarEl.classList.add('open');
  if (isMobile()) overlayEl.classList.add('show');
}
function closeSidebar() {
  sidebarEl.classList.remove('open');
  overlayEl.classList.remove('show');
}
toggleBtn.addEventListener('click', () => {
  sidebarEl.classList.contains('open') ? closeSidebar() : openSidebar();
});
overlayEl.addEventListener('click', closeSidebar);

// Sidebar starts open on desktop, closed on mobile
if (!isMobile()) sidebarEl.classList.add('open');

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/```([\s\S]*?)```/g, (m, code) => `<pre class="code-block"><code>${code.trim()}</code></pre>`);
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function stripMarkdown(text) {
  return text
    .replace(/```([\s\S]*?)```/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/\*(.+?)\*/g, '$1');
}

function clearMessages() { messagesEl.innerHTML = ''; }

function renderWelcome() {
  clearMessages();
  const wrap = document.createElement('div');
  wrap.className = 'welcome';
  wrap.innerHTML = `
    <div class="welcome-mark">✨</div>
    <h2>Hey, I'm Nova</h2>
    <p>Ask me anything, or try one of these</p>
    <div class="chip-grid" id="chipGrid"></div>
  `;
  messagesEl.appendChild(wrap);
  const grid = wrap.querySelector('#chipGrid');
  SUGGESTIONS.forEach(s => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = s;
    chip.addEventListener('click', () => {
      inputEl.value = s;
      sendMessage();
    });
    grid.appendChild(chip);
  });
}

function renderMessage(text, role) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'bot' ? '✨' : '🙂';
  row.appendChild(avatar);

  const col = document.createElement('div');
  col.className = 'msg-col';

  const bubble = document.createElement('div');
  bubble.className = 'msg';
  if (role === 'bot') {
    bubble.innerHTML = renderMarkdown(text);
  } else {
    bubble.textContent = text;
  }
  col.appendChild(bubble);

  if (role === 'bot') {
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.textContent = 'Copy';
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(stripMarkdown(text)).then(() => {
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.classList.remove('copied');
        }, 1500);
      });
    });
    col.appendChild(copyBtn);
  }

  row.appendChild(col);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return row;
}

function renderTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.innerHTML = `
    <div class="avatar">✨</div>
    <div class="msg-col">
      <div class="msg"><div class="typing-dots"><span></span><span></span><span></span></div></div>
    </div>
  `;
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return row;
}

async function loadConversations() {
  const res = await fetch('/api/conversations');
  const data = await res.json();
  activeConvId = data.active;
  convItemsEl.innerHTML = '';
  data.conversations.forEach(conv => {
    const item = document.createElement('div');
    item.className = 'conv-item' + (conv.id === activeConvId ? ' active' : '');
    item.dataset.id = conv.id;

    const titleSpan = document.createElement('span');
    titleSpan.textContent = conv.title;
    item.appendChild(titleSpan);

    const delBtn = document.createElement('button');
    delBtn.className = 'del-btn';
    delBtn.textContent = '✕';
    delBtn.title = 'Delete chat';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteConversation(conv.id);
    });
    item.appendChild(delBtn);

    item.addEventListener('click', () => {
      selectConversation(conv.id);
      if (isMobile()) closeSidebar();
    });
    convItemsEl.appendChild(item);
  });
  return data;
}

async function selectConversation(convId) {
  const res = await fetch('/api/conversations/' + convId);
  if (!res.ok) return;
  const data = await res.json();
  activeConvId = data.id;
  chatTitleEl.textContent = data.title;
  clearMessages();
  if (data.messages.length === 0) {
    renderWelcome();
  } else {
    data.messages.forEach(m => renderMessage(m.text, m.role));
  }
  document.querySelectorAll('.conv-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === convId);
  });
}

async function startNewChat() {
  const res = await fetch('/api/conversations/new', { method: 'POST' });
  const data = await res.json();
  await loadConversations();
  await selectConversation(data.id);
  if (!isMobile()) inputEl.focus();
  if (isMobile()) closeSidebar();
}

async function deleteConversation(convId) {
  await fetch('/api/conversations/' + convId, { method: 'DELETE' });
  const data = await loadConversations();
  if (data.conversations.length === 0) {
    await startNewChat();
  } else if (convId === activeConvId || !data.active) {
    await selectConversation(data.conversations[0].id);
  }
}

function autoResize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  if (messagesEl.querySelector('.welcome')) clearMessages();

  renderMessage(text, 'user');
  inputEl.value = '';
  autoResize();
  sendBtn.disabled = true;

  const typingRow = renderTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    typingRow.remove();
    if (data.error) {
      renderMessage('Error: ' + data.error, 'bot');
    } else {
      renderMessage(data.reply, 'bot');
      chatTitleEl.textContent = data.title;
      loadConversations();
    }
  } catch (err) {
    typingRow.remove();
    renderMessage('Network error: ' + err.message, 'bot');
  } finally {
    sendBtn.disabled = false;
    if (!isMobile()) inputEl.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('input', autoResize);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
newChatBtn.addEventListener('click', startNewChat);

(async () => {
  const data = await loadConversations();

})();
