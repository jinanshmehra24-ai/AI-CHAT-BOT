<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Chatbot</title>
<style>
  :root {
    --sidebar-bg: #1a1a1e;
    --sidebar-hover: #2a2a2f;
    --sidebar-active: #34343b;
    --sidebar-text: #e5e5e7;
    --sidebar-text-dim: #9a9aa0;
    --main-bg: #ffffff;
    --user-bubble: #0a84ff;
    --bot-bubble: #f0f0f2;
    --text-dark: #1c1c1e;
    --text-light: #ffffff;
    --border: #e5e5e7;
    --accent: #0a84ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body { display: flex; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    transition: margin-left 0.2s ease;
  }
  .sidebar.collapsed { margin-left: -260px; }
  .new-chat-btn {
    margin: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #3a3a40;
    background: transparent;
    color: var(--sidebar-text);
    font-size: 14px;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .new-chat-btn:hover { background: var(--sidebar-hover); }
  .conv-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px;
  }
  .conv-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--sidebar-text-dim);
    padding: 10px 8px 4px;
  }
  .conv-item {
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 13.5px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .conv-item:hover { background: var(--sidebar-hover); }
  .conv-item.active { background: var(--sidebar-active); }
  .conv-item .del-btn {
    opacity: 0;
    background: none;
    border: none;
    color: var(--sidebar-text-dim);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 5px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .conv-item:hover .del-btn { opacity: 1; }
  .conv-item .del-btn:hover { color: #ff6b6b; background: rgba(255,255,255,0.08); }
  .sidebar-footer {
    padding: 12px;
    font-size: 11.5px;
    color: var(--sidebar-text-dim);
    border-top: 1px solid #2a2a2f;
  }

  /* ---------- Main chat area ---------- */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: var(--main-bg);
    min-width: 0;
  }
  .header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
    color: var(--text-dark);
  }
  .toggle-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 15px;
    color: #666;
  }
  .toggle-btn:hover { background: #f5f5f7; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  .msg-row {
    display: flex;
    flex-direction: column;
    max-width: 75%;
  }
  .msg-row.user { align-self: flex-end; align-items: flex-end; }
  .msg-row.bot { align-self: flex-start; align-items: flex-start; }

  .msg {
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .msg-row.user .msg {
    background: var(--user-bubble);
    color: var(--text-light);
    border-bottom-right-radius: 4px;
  }
  .msg-row.bot .msg {
    background: var(--bot-bubble);
    color: var(--text-dark);
    border-bottom-left-radius: 4px;
  }
  .msg.typing { color: #888; font-style: italic; }

  .copy-btn {
    margin-top: 4px;
    background: none;
    border: none;
    color: #9a9aa0;
    font-size: 12px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .msg-row.bot:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { background: #f0f0f2; color: #444; }
  .copy-btn.copied { opacity: 1; color: #0a8a3e; }

  .input-row {
    display: flex;
    padding: 16px 24px 20px;
    gap: 8px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  .input-row input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 22px;
    border: 1px solid var(--border);
    font-size: 14.5px;
    outline: none;
  }
  .input-row input:focus { border-color: var(--accent); }
  .input-row button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 22px;
    padding: 0 22px;
    font-size: 14.5px;
    cursor: pointer;
  }
  .input-row button:disabled { opacity: 0.5; cursor: default; }

  @media (max-width: 640px) {
    .sidebar { position: fixed; z-index: 10; }
    .sidebar:not(.collapsed) { margin-left: 0; }
    .sidebar.collapsed { margin-left: -260px; }
  }
</style>
</head>
<body>
  <div class="sidebar" id="sidebar">
    <button class="new-chat-btn" id="newChatBtn">+ New chat</button>
    <div class="conv-label">Recent</div>
    <div class="conv-list" id="convList"></div>
    <div class="sidebar-footer">Powered by Gemini</div>
  </div>

  <div class="main">
    <div class="header">
      <button class="toggle-btn" id="toggleBtn" title="Toggle sidebar">☰</button>
      <h1 id="chatTitle">My AI Chatbot</h1>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <input id="input" type="text" placeholder="Type a message..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const newChatBtn = document.getElementById('newChatBtn');
const convListEl = document.getElementById('convList');
const toggleBtn = document.getElementById('toggleBtn');
const sidebarEl = document.getElementById('sidebar');
const chatTitleEl = document.getElementById('chatTitle');

let activeConvId = null;

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderMessage(text, role) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;

  const bubble = document.createElement('div');
  bubble.className = 'msg';
  bubble.textContent = text;
  row.appendChild(bubble);

  if (role === 'bot') {
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.textContent = 'Copy';
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.classList.remove('copied');
        }, 1500);
      });
    });
    row.appendChild(copyBtn);
  }

  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return row;
}

function renderTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  const bubble = document.createElement('div');
  bubble.className = 'msg typing';
  bubble.textContent = 'Thinking...';
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return row;
}

async function loadConversations() {
  const res = await fetch('/api/conversations');
  const data = await res.json();
  activeConvId = data.active;
  convListEl.innerHTML = '';
  data.conversations.forEach(conv => {
    const item = document.createElement('div');
    item.className = 'conv-item' + (conv.id === activeConvId ? ' active' : '');
    item.dataset.id = conv.id;

    const titleSpan = document.createElement('span');
    titleSpan.textContent = conv.title;
    item.appendChild(titleSpan);

    const delBtn = document.createElement('button');
    delBtn.className = 'del-btn';
    delBtn.textContent = '✕';
    delBtn.title = 'Delete chat';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteConversation(conv.id);
    });
    item.appendChild(delBtn);

    item.addEventListener('click', () => selectConversation(conv.id));
    convListEl.appendChild(item);
  });
  return data;
}

async function selectConversation(convId) {
  const res = await fetch('/api/conversations/' + convId);
  if (!res.ok) return;
  const data = await res.json();
  activeConvId = data.id;
  chatTitleEl.textContent = data.title;
  messagesEl.innerHTML = '';
  if (data.messages.length === 0) {
    renderMessage('Hi! Ask me anything.', 'bot');
  } else {
    data.messages.forEach(m => renderMessage(m.text, m.role));
  }
  document.querySelectorAll('.conv-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === convId);
  });
}

async function startNewChat() {
  const res = await fetch('/api/conversations/new', { method: 'POST' });
  const data = await res.json();
  await loadConversations();
  await selectConversation(data.id);
  inputEl.focus();
}

async function deleteConversation(convId) {
  await fetch('/api/conversations/' + convId, { method: 'DELETE' });
  const data = await loadConversations();
  if (data.conversations.length === 0) {
    await startNewChat();
  } else if (convId === activeConvId || !data.active) {
    await selectConversation(data.conversations[0].id);
  }
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  renderMessage(text, 'user');
  inputEl.value = '';
  sendBtn.disabled = true;

  const typingRow = renderTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    typingRow.remove();
    if (data.error) {
      renderMessage('Error: ' + data.error, 'bot');
    } else {
      renderMessage(data.reply, 'bot');
      chatTitleEl.textContent = data.title;
      loadConversations(); // refresh sidebar title/order
    }
  } catch (err) {
    typingRow.remove();
    renderMessage('Network error: ' + err.message, 'bot');
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});
newChatBtn.addEventListener('click', startNewChat);
toggleBtn.addEventListener('click', () => sidebarEl.classList.toggle('collapsed'));

// ---- Initial load ----
(async () => {
  const data = await loadConversations();
  if (data.active) {
    await selectConversation(data.active);
  } else {
    await startNewChat();
  }
})();
</script>
</body>
</html>
