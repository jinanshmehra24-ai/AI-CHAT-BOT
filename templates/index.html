<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Chatbot</title>
<style>
  :root {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --user-bubble: #0a84ff;
    --bot-bubble: #e9e9eb;
    --text-dark: #1c1c1e;
    --text-light: #ffffff;
    --border: #e0e0e2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 640px;
    height: 90vh;
    max-height: 800px;
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }
  .header button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    color: #666;
  }
  .header button:hover { background: #f0f0f0; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: var(--text-light);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    color: var(--text-dark);
    border-bottom-left-radius: 4px;
  }
  .msg.typing {
    align-self: flex-start;
    background: var(--bot-bubble);
    color: #888;
    font-style: italic;
  }
  .input-row {
    display: flex;
    padding: 14px;
    border-top: 1px solid var(--border);
    gap: 8px;
  }
  .input-row input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 14px;
    outline: none;
  }
  .input-row input:focus { border-color: var(--user-bubble); }
  .input-row button {
    background: var(--user-bubble);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 0 20px;
    font-size: 14px;
    cursor: pointer;
  }
  .input-row button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>My AI Chatbot</h1>
      <button id="clearBtn">Clear chat</button>
    </div>
    <div class="messages" id="messages">
      <div class="msg bot">Hi! Ask me anything.</div>
    </div>
    <div class="input-row">
      <input id="input" type="text" placeholder="Type a message..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const clearBtn = document.getElementById('clearBtn');

function addMessage(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  inputEl.value = '';
  sendBtn.disabled = true;

  const typingEl = addMessage('Thinking...', 'typing');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    typingEl.remove();
    if (data.error) {
      addMessage('Error: ' + data.error, 'bot');
    } else {
      addMessage(data.reply, 'bot');
    }
  } catch (err) {
    typingEl.remove();
    addMessage('Network error: ' + err.message, 'bot');
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});
clearBtn.addEventListener('click', async () => {
  await fetch('/api/clear', { method: 'POST' });
  messagesEl.innerHTML = '';
  addMessage('Chat cleared. Ask me anything.', 'bot');
});
</script>
</body>
</html>
